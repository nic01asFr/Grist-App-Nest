n            color: '#161616'\n          }}>\n            {title}\n          </h2>\n          <button\n            onClick={onClose}\n            style={{\n              background: 'none',\n              border: 'none',\n              cursor: 'pointer',\n              fontSize: '24px',\n              color: '#666',\n              padding: '0',\n              lineHeight: '1',\n              width: '32px',\n              height: '32px',\n              borderRadius: '4px',\n              transition: 'background 0.2s'\n            }}\n            onMouseEnter={(e) => {\n              e.currentTarget.style.background = '#f0f0f0';\n            }}\n            onMouseLeave={(e) => {\n              e.currentTarget.style.background = 'none';\n            }}\n          >\n            ×\n          </button>\n        </div>\n\n        {/* Body */}\n        <div style={{\n          padding: '24px',\n          overflowY: 'auto',\n          flex: 1\n        }}>\n          {children}\n        </div>\n\n        {/* Footer */}\n        {footer && (\n          <div style={{\n            padding: '16px 24px',\n            borderTop: '1px solid #e5e5e5',\n            background: '#f6f6f6',\n            display: 'flex',\n            justifyContent: 'flex-end',\n            gap: '12px'\n          }}>\n            {footer}\n          </div>\n        )}\n      </div>\n    </div>\n  );\n};\n        ".trim()},{template_id:"base-textarea",template_name:"DSFR Textarea",category:"base",description:"DSFR Textarea component with validation",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  value = '',\n  onChange = () => {},\n  placeholder = '',\n  label = '',\n  error = '',\n  rows = 4,\n  maxLength = null,\n  disabled = false,\n  required = false\n}) => {\n  return (\n    <div style={{ marginBottom: '16px', fontFamily: \"'Marianne', Arial, sans-serif\" }}>\n      {label && (\n        <label style={{\n          display: 'block',\n          marginBottom: '8px',\n          fontWeight: '500',\n          color: '#161616',\n          fontSize: '14px'\n        }}>\n          {label}\n          {required && <span style={{ color: '#e1000f', marginLeft: '4px' }}>*</span>}\n        </label>\n      )}\n      <textarea\n        value={value}\n        onChange={(e) => onChange(e.target.value)}\n        placeholder={placeholder}\n        rows={rows}\n        maxLength={maxLength}\n        disabled={disabled}\n        style={{\n          width: '100%',\n          padding: '12px',\n          fontSize: '16px',\n          fontFamily: \"'Marianne', Arial, sans-serif\",\n          border: error ? '2px solid #e1000f' : '1px solid #ddd',\n          borderRadius: '4px',\n          resize: 'vertical',\n          boxSizing: 'border-box',\n          background: disabled ? '#f6f6f6' : 'white',\n          cursor: disabled ? 'not-allowed' : 'text'\n        }}\n      />\n      {maxLength && (\n        <div style={{ fontSize: '12px', color: '#666', marginTop: '4px', textAlign: 'right' }}>\n          {value.length} / {maxLength}\n        </div>\n      )}\n      {error && (\n        <div style={{ color: '#e1000f', fontSize: '12px', marginTop: '4px' }}>\n          {error}\n        </div>\n      )}\n    </div>\n  );\n};\n        ".trim()},{template_id:"base-checkbox",template_name:"DSFR Checkbox",category:"base",description:"DSFR Checkbox component",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  checked = false,\n  onChange = () => {},\n  label = '',\n  disabled = false,\n  id = 'checkbox-' + Math.random().toString(36).substr(2, 9)\n}) => {\n  return (\n    <div style={{\n      display: 'flex',\n      alignItems: 'center',\n      gap: '8px',\n      fontFamily: \"'Marianne', Arial, sans-serif\",\n      cursor: disabled ? 'not-allowed' : 'pointer',\n      opacity: disabled ? 0.6 : 1\n    }}>\n      <input\n        type=\"checkbox\"\n        id={id}\n        checked={checked}\n        onChange={(e) => onChange(e.target.checked)}\n        disabled={disabled}\n        style={{\n          width: '20px',\n          height: '20px',\n          cursor: disabled ? 'not-allowed' : 'pointer',\n          accentColor: '#000091'\n        }}\n      />\n      {label && (\n        <label\n          htmlFor={id}\n          style={{\n            fontSize: '16px',\n            color: '#161616',\n            cursor: disabled ? 'not-allowed' : 'pointer',\n            userSelect: 'none'\n          }}\n        >\n          {label}\n        </label>\n      )}\n    </div>\n  );\n};\n        ".trim()},{template_id:"base-radio",template_name:"DSFR Radio",category:"base",description:"DSFR Radio button group",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  options = [],\n  value = '',\n  onChange = () => {},\n  label = '',\n  name = 'radio-' + Math.random().toString(36).substr(2, 9),\n  disabled = false\n}) => {\n  return (\n    <div style={{ marginBottom: '16px', fontFamily: \"'Marianne', Arial, sans-serif\" }}>\n      {label && (\n        <div style={{\n          marginBottom: '12px',\n          fontWeight: '500',\n          color: '#161616',\n          fontSize: '14px'\n        }}>\n          {label}\n        </div>\n      )}\n      <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>\n        {options.map((option, index) => (\n          <div\n            key={index}\n            style={{\n              display: 'flex',\n              alignItems: 'center',\n              gap: '8px',\n              cursor: disabled ? 'not-allowed' : 'pointer',\n              opacity: disabled ? 0.6 : 1\n            }}\n          >\n            <input\n              type=\"radio\"\n              id={`${name}-${index}`}\n              name={name}\n              value={option.value}\n              checked={value === option.value}\n              onChange={() => onChange(option.value)}\n              disabled={disabled}\n              style={{\n                width: '20px',\n                height: '20px',\n                cursor: disabled ? 'not-allowed' : 'pointer',\n                accentColor: '#000091'\n              }}\n            />\n            <label\n              htmlFor={`${name}-${index}`}\n              style={{\n                fontSize: '16px',\n                color: '#161616',\n                cursor: disabled ? 'not-allowed' : 'pointer',\n                userSelect: 'none'\n              }}\n            >\n              {option.label}\n            </label>\n          </div>\n        ))}\n      </div>\n    </div>\n  );\n};\n        ".trim()},{template_id:"base-switch",template_name:"DSFR Switch",category:"base",description:"DSFR Toggle switch component",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  checked = false,\n  onChange = () => {},\n  label = '',\n  disabled = false\n}) => {\n  return (\n    <div style={{\n      display: 'flex',\n      alignItems: 'center',\n      gap: '12px',\n      fontFamily: \"'Marianne', Arial, sans-serif\",\n      opacity: disabled ? 0.6 : 1\n    }}>\n      <div\n        onClick={() => !disabled && onChange(!checked)}\n        style={{\n          width: '48px',\n          height: '24px',\n          background: checked ? '#000091' : '#ddd',\n          borderRadius: '12px',\n          position: 'relative',\n          cursor: disabled ? 'not-allowed' : 'pointer',\n          transition: 'background 0.2s'\n        }}\n      >\n        <div style={{\n          position: 'absolute',\n          top: '2px',\n          left: checked ? '26px' : '2px',\n          width: '20px',\n          height: '20px',\n          background: 'white',\n          borderRadius: '50%',\n          transition: 'left 0.2s',\n          boxShadow: '0 2px 4px rgba(0,0,0,0.2)'\n        }} />\n      </div>\n      {label && (\n        <span style={{\n          fontSize: '16px',\n          color: '#161616',\n          cursor: disabled ? 'not-allowed' : 'pointer',\n          userSelect: 'none'\n        }} onClick={() => !disabled && onChange(!checked)}>\n          {label}\n        </span>\n      )}\n    </div>\n  );\n};\n        ".trim()},{template_id:"base-tooltip",template_name:"DSFR Tooltip",category:"base",description:"DSFR Tooltip component",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  content = '',\n  children,\n  position = 'top'\n}) => {\n  const [visible, setVisible] = useState(false);\n\n  const positions = {\n    top: { bottom: '100%', left: '50%', transform: 'translateX(-50%)', marginBottom: '8px' },\n    bottom: { top: '100%', left: '50%', transform: 'translateX(-50%)', marginTop: '8px' },\n    left: { right: '100%', top: '50%', transform: 'translateY(-50%)', marginRight: '8px' },\n    right: { left: '100%', top: '50%', transform: 'translateY(-50%)', marginLeft: '8px' }\n  };\n\n  return (\n    <div\n      style={{ position: 'relative', display: 'inline-block' }}\n      onMouseEnter={() => setVisible(true)}\n      onMouseLeave={() => setVisible(false)}\n    >\n      {children}\n      {visible && content && (\n        <div style={{\n          position: 'absolute',\n          ...positions[position],\n          background: '#161616',\n          color: 'white',\n          padding: '8px 12px',\n          borderRadius: '4px',\n          fontSize: '14px',\n          fontFamily: \"'Marianne', Arial, sans-serif\",\n          whiteSpace: 'nowrap',\n          zIndex: 1000,\n          boxShadow: '0 2px 8px rgba(0,0,0,0.15)'\n        }}>\n          {content}\n        </div>\n      )}\n    </div>\n  );\n};\n        ".trim()},{template_id:"base-tabs",template_name:"DSFR Tabs",category:"base",description:"DSFR Tabs navigation component",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  tabs = [],\n  activeTab = 0,\n  onChange = () => {}\n}) => {\n  return (\n    <div style={{ fontFamily: \"'Marianne', Arial, sans-serif\" }}>\n      {/* Tab Headers */}\n      <div style={{\n        display: 'flex',\n        borderBottom: '2px solid #e5e5e5',\n        gap: '4px'\n      }}>\n        {tabs.map((tab, index) => (\n          <button\n            key={index}\n            onClick={() => onChange(index)}\n            style={{\n              padding: '12px 24px',\n              fontSize: '16px',\n              fontWeight: activeTab === index ? '700' : '400',\n              color: activeTab === index ? '#000091' : '#666',\n              background: 'transparent',\n              border: 'none',\n              borderBottom: activeTab === index ? '3px solid #000091' : '3px solid transparent',\n              cursor: 'pointer',\n              transition: 'all 0.2s',\n              marginBottom: '-2px'\n            }}\n          >\n            {tab.label}\n          </button>\n        ))}\n      </div>\n\n      {/* Tab Content */}\n      <div style={{ padding: '24px 0' }}>\n        {tabs[activeTab]?.content}\n      </div>\n    </div>\n  );\n};\n        ".trim()},{template_id:"base-accordion",template_name:"DSFR Accordion",category:"base",description:"DSFR Accordion/Collapsible component",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  title = '',\n  children,\n  defaultOpen = false\n}) => {\n  const [isOpen, setIsOpen] = useState(defaultOpen);\n\n  return (\n    <div style={{\n      border: '1px solid #e5e5e5',\n      borderRadius: '4px',\n      marginBottom: '8px',\n      fontFamily: \"'Marianne', Arial, sans-serif\"\n    }}>\n      {/* Header */}\n      <div\n        onClick={() => setIsOpen(!isOpen)}\n        style={{\n          padding: '16px',\n          background: '#f6f6f6',\n          cursor: 'pointer',\n          display: 'flex',\n          justifyContent: 'space-between',\n          alignItems: 'center',\n          fontWeight: '500',\n          color: '#161616',\n          userSelect: 'none'\n        }}\n      >\n        <span>{title}</span>\n        <span style={{\n          transform: isOpen ? 'rotate(180deg)' : 'rotate(0deg)',\n          transition: 'transform 0.2s',\n          fontSize: '12px'\n        }}>\n          ▼\n        </span>\n      </div>\n\n      {/* Content */}\n      {isOpen && (\n        <div style={{\n          padding: '16px',\n          borderTop: '1px solid #e5e5e5'\n        }}>\n          {children}\n        </div>\n      )}\n    </div>\n  );\n};\n        ".trim()},{template_id:"base-breadcrumb",template_name:"DSFR Breadcrumb",category:"base",description:"DSFR Breadcrumb navigation component",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  items = [],\n  separator = '›'\n}) => {\n  return (\n    <nav style={{\n      fontFamily: \"'Marianne', Arial, sans-serif\",\n      fontSize: '14px',\n      color: '#666',\n      marginBottom: '16px'\n    }}>\n      <div style={{ display: 'flex', alignItems: 'center', gap: '8px', flexWrap: 'wrap' }}>\n        {items.map((item, index) => (\n          <React.Fragment key={index}>\n            <span\n              onClick={item.onClick}\n              style={{\n                color: index === items.length - 1 ? '#161616' : '#000091',\n                cursor: item.onClick ? 'pointer' : 'default',\n                textDecoration: item.onClick && index !== items.length - 1 ? 'underline' : 'none',\n                fontWeight: index === items.length - 1 ? '500' : '400'\n              }}\n            >\n              {item.label}\n            </span>\n            {index < items.length - 1 && (\n              <span style={{ color: '#999' }}>{separator}</span>\n            )}\n          </React.Fragment>\n        ))}\n      </div>\n    </nav>\n  );\n};\n        ".trim()},{template_id:"base-pagination",template_name:"DSFR Pagination",category:"base",description:"DSFR Pagination component",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  currentPage = 1,\n  totalPages = 1,\n  onPageChange = () => {},\n  maxVisible = 5\n}) => {\n  const getPageNumbers = () => {\n    const pages = [];\n    let start = Math.max(1, currentPage - Math.floor(maxVisible / 2));\n    let end = Math.min(totalPages, start + maxVisible - 1);\n\n    if (end - start + 1 < maxVisible) {\n      start = Math.max(1, end - maxVisible + 1);\n    }\n\n    for (let i = start; i <= end; i++) {\n      pages.push(i);\n    }\n    return pages;\n  };\n\n  const PageButton = ({ page, active }) => (\n    <button\n      onClick={() => onPageChange(page)}\n      disabled={active}\n      style={{\n        padding: '8px 12px',\n        minWidth: '40px',\n        fontSize: '14px',\n        fontFamily: \"'Marianne', Arial, sans-serif\",\n        background: active ? '#000091' : 'white',\n        color: active ? 'white' : '#161616',\n        border: '1px solid #ddd',\n        borderRadius: '4px',\n        cursor: active ? 'default' : 'pointer',\n        fontWeight: active ? '700' : '400'\n      }}\n    >\n      {page}\n    </button>\n  );\n\n  return (\n    <div style={{\n      display: 'flex',\n      gap: '4px',\n      alignItems: 'center',\n      justifyContent: 'center',\n      padding: '16px 0',\n      fontFamily: \"'Marianne', Arial, sans-serif\"\n    }}>\n      {/* Previous */}\n      <button\n        onClick={() => onPageChange(currentPage - 1)}\n        disabled={currentPage === 1}\n        style={{\n          padding: '8px 12px',\n          fontSize: '14px',\n          background: 'white',\n          color: currentPage === 1 ? '#999' : '#000091',\n          border: '1px solid #ddd',\n          borderRadius: '4px',\n          cursor: currentPage === 1 ? 'not-allowed' : 'pointer'\n        }}\n      >\n        ‹ Précédent\n      </button>\n\n      {/* First page */}\n      {getPageNumbers()[0] > 1 && (\n        <>\n          <PageButton page={1} active={currentPage === 1} />\n          {getPageNumbers()[0] > 2 && <span style={{ padding: '0 8px' }}>...</span>}\n        </>\n      )}\n\n      {/* Page numbers */}\n      {getPageNumbers().map(page => (\n        <PageButton key={page} page={page} active={currentPage === page} />\n      ))}\n\n      {/* Last page */}\n      {getPageNumbers()[getPageNumbers().length - 1] < totalPages && (\n        <>\n          {getPageNumbers()[getPageNumbers().length - 1] < totalPages - 1 && (\n            <span style={{ padding: '0 8px' }}>...</span>\n          )}\n          <PageButton page={totalPages} active={currentPage === totalPages} />\n        </>\n      )}\n\n      {/* Next */}\n      <button\n        onClick={() => onPageChange(currentPage + 1)}\n        disabled={currentPage === totalPages}\n        style={{\n          padding: '8px 12px',\n          fontSize: '14px',\n          background: 'white',\n          color: currentPage === totalPages ? '#999' : '#000091',\n          border: '1px solid #ddd',\n          borderRadius: '4px',\n          cursor: currentPage === totalPages ? 'not-allowed' : 'pointer'\n        }}\n      >\n        Suivant ›\n      </button>\n    </div>\n  );\n};\n        ".trim()},{template_id:"base-spinner",template_name:"DSFR Spinner",category:"base",description:"DSFR Loading spinner component",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  size = 'md',\n  color = '#000091',\n  text = ''\n}) => {\n  const sizes = {\n    sm: 16,\n    md: 32,\n    lg: 48,\n    xl: 64\n  };\n\n  const spinnerSize = sizes[size];\n\n  return (\n    <div style={{\n      display: 'flex',\n      flexDirection: 'column',\n      alignItems: 'center',\n      gap: '12px',\n      fontFamily: \"'Marianne', Arial, sans-serif\"\n    }}>\n      <div style={{\n        width: spinnerSize,\n        height: spinnerSize,\n        border: `3px solid ${color}20`,\n        borderTop: `3px solid ${color}`,\n        borderRadius: '50%',\n        animation: 'spin 1s linear infinite'\n      }} />\n      {text && (\n        <div style={{ fontSize: '14px', color: '#666' }}>\n          {text}\n        </div>\n      )}\n      <style>\n        {`\n          @keyframes spin {\n            0% { transform: rotate(0deg); }\n            100% { transform: rotate(360deg); }\n          }\n        `}\n      </style>\n    </div>\n  );\n};\n        ".trim()},{template_id:"base-progressbar",template_name:"DSFR ProgressBar",category:"base",description:"DSFR Progress bar component",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  value = 0,\n  max = 100,\n  label = '',\n  showPercentage = true,\n  color = '#000091',\n  height = 8\n}) => {\n  const percentage = Math.min(100, Math.max(0, (value / max) * 100));\n\n  return (\n    <div style={{ fontFamily: \"'Marianne', Arial, sans-serif\", width: '100%' }}>\n      {/* Label and percentage */}\n      {(label || showPercentage) && (\n        <div style={{\n          display: 'flex',\n          justifyContent: 'space-between',\n          marginBottom: '8px',\n          fontSize: '14px',\n          color: '#161616'\n        }}>\n          {label && <span>{label}</span>}\n          {showPercentage && <span style={{ fontWeight: '500' }}>{Math.round(percentage)}%</span>}\n        </div>\n      )}\n\n      {/* Progress bar */}\n      <div style={{\n        width: '100%',\n        height: height,\n        background: '#e5e5e5',\n        borderRadius: height / 2,\n        overflow: 'hidden'\n      }}>\n        <div style={{\n          width: `${percentage}%`,\n          height: '100%',\n          background: color,\n          transition: 'width 0.3s ease',\n          borderRadius: height / 2\n        }} />\n      </div>\n    </div>\n  );\n};\n        ".trim()},{template_id:"base-avatar",template_name:"DSFR Avatar",category:"base",description:"DSFR Avatar component with initials",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  name = '',\n  src = null,\n  size = 'md',\n  color = '#000091'\n}) => {\n  const sizes = {\n    sm: 32,\n    md: 48,\n    lg: 64,\n    xl: 96\n  };\n\n  const avatarSize = sizes[size];\n\n  const getInitials = (name) => {\n    if (!name) return '?';\n    const parts = name.trim().split(' ');\n    if (parts.length === 1) return parts[0].charAt(0).toUpperCase();\n    return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();\n  };\n\n  return (\n    <div style={{\n      width: avatarSize,\n      height: avatarSize,\n      borderRadius: '50%',\n      background: src ? 'transparent' : color,\n      color: 'white',\n      display: 'flex',\n      alignItems: 'center',\n      justifyContent: 'center',\n      fontSize: avatarSize / 2.5,\n      fontWeight: '700',\n      fontFamily: \"'Marianne', Arial, sans-serif\",\n      overflow: 'hidden',\n      flexShrink: 0\n    }}>\n      {src ? (\n        <img src={src} alt={name} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />\n      ) : (\n        <span>{getInitials(name)}</span>\n      )}\n    </div>\n  );\n};\n        ".trim()},{template_id:"base-search-input",template_name:"DSFR Search Input",category:"base",description:"DSFR Search input with icon",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  value = '',\n  onChange = () => {},\n  onSearch = () => {},\n  placeholder = 'Rechercher...',\n  disabled = false\n}) => {\n  const handleKeyPress = (e) => {\n    if (e.key === 'Enter') {\n      onSearch(value);\n    }\n  };\n\n  return (\n    <div style={{\n      position: 'relative',\n      width: '100%',\n      fontFamily: \"'Marianne', Arial, sans-serif\"\n    }}>\n      <input\n        type=\"text\"\n        value={value}\n        onChange={(e) => onChange(e.target.value)}\n        onKeyPress={handleKeyPress}\n        placeholder={placeholder}\n        disabled={disabled}\n        style={{\n          width: '100%',\n          padding: '12px 44px 12px 16px',\n          fontSize: '16px',\n          border: '1px solid #ddd',\n          borderRadius: '4px',\n          boxSizing: 'border-box',\n          background: disabled ? '#f6f6f6' : 'white'\n        }}\n      />\n      <button\n        onClick={() => onSearch(value)}\n        disabled={disabled}\n        style={{\n          position: 'absolute',\n          right: '4px',\n          top: '50%',\n          transform: 'translateY(-50%)',\n          width: '36px',\n          height: '36px',\n          background: '#000091',\n          color: 'white',\n          border: 'none',\n          borderRadius: '4px',\n          cursor: disabled ? 'not-allowed' : 'pointer',\n          display: 'flex',\n          alignItems: 'center',\n          justifyContent: 'center',\n          fontSize: '16px'\n        }}\n      >\n        🔍\n      </button>\n    </div>\n  );\n};\n        ".trim()},{template_id:"base-divider",template_name:"DSFR Divider",category:"base",description:"DSFR Divider/Separator component",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  orientation = 'horizontal',\n  text = '',\n  spacing = 16\n}) => {\n  if (orientation === 'vertical') {\n    return (\n      <div style={{\n        width: '1px',\n        background: '#e5e5e5',\n        margin: `0 ${spacing}px`,\n        alignSelf: 'stretch'\n      }} />\n    );\n  }\n\n  if (text) {\n    return (\n      <div style={{\n        display: 'flex',\n        alignItems: 'center',\n        margin: `${spacing}px 0`,\n        fontFamily: \"'Marianne', Arial, sans-serif\"\n      }}>\n        <div style={{ flex: 1, height: '1px', background: '#e5e5e5' }} />\n        <span style={{ padding: '0 16px', fontSize: '14px', color: '#666' }}>{text}</span>\n        <div style={{ flex: 1, height: '1px', background: '#e5e5e5' }} />\n      </div>\n    );\n  }\n\n  return (\n    <div style={{\n      height: '1px',\n      background: '#e5e5e5',\n      margin: `${spacing}px 0`\n    }} />\n  );\n};\n        ".trim()},{template_id:"base-datepicker",template_name:"DSFR DatePicker",category:"base",description:"DSFR Date picker component",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  value = '',\n  onChange = () => {},\n  label = '',\n  placeholder = 'jj/mm/aaaa',\n  error = '',\n  disabled = false,\n  required = false,\n  min = '',\n  max = ''\n}) => {\n  return (\n    <div style={{ marginBottom: '16px', fontFamily: \"'Marianne', Arial, sans-serif\" }}>\n      {label && (\n        <label style={{\n          display: 'block',\n          marginBottom: '8px',\n          fontWeight: '500',\n          color: '#161616',\n          fontSize: '14px'\n        }}>\n          {label}\n          {required && <span style={{ color: '#e1000f', marginLeft: '4px' }}>*</span>}\n        </label>\n      )}\n      <input\n        type=\"date\"\n        value={value}\n        onChange={(e) => onChange(e.target.value)}\n        placeholder={placeholder}\n        disabled={disabled}\n        min={min}\n        max={max}\n        style={{\n          width: '100%',\n          padding: '12px',\n          fontSize: '16px',\n          fontFamily: \"'Marianne', Arial, sans-serif\",\n          border: error ? '2px solid #e1000f' : '1px solid #ddd',\n          borderRadius: '4px',\n          boxSizing: 'border-box',\n          background: disabled ? '#f6f6f6' : 'white',\n          cursor: disabled ? 'not-allowed' : 'text'\n        }}\n      />\n      {error && (\n        <div style={{ color: '#e1000f', fontSize: '12px', marginTop: '4px' }}>\n          {error}\n        </div>\n      )}\n    </div>\n  );\n};\n        ".trim()},{template_id:"base-fileupload",template_name:"DSFR File Upload",category:"base",description:"DSFR File upload component with drag & drop",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  onChange = () => {},\n  accept = '*',\n  multiple = false,\n  label = 'Choisir un fichier',\n  maxSize = 10485760,\n  disabled = false\n}) => {\n  const [isDragging, setIsDragging] = useState(false);\n  const [files, setFiles] = useState([]);\n  const inputRef = useRef(null);\n\n  const handleFiles = (fileList) => {\n    const newFiles = Array.from(fileList).filter(file => {\n      if (file.size > maxSize) {\n        alert(`Fichier trop volumineux: ${file.name} (${(file.size / 1048576).toFixed(2)} MB)`);\n        return false;\n      }\n      return true;\n    });\n\n    setFiles(multiple ? [...files, ...newFiles] : newFiles);\n    onChange(multiple ? [...files, ...newFiles] : newFiles[0]);\n  };\n\n  const handleDrop = (e) => {\n    e.preventDefault();\n    setIsDragging(false);\n    if (!disabled) handleFiles(e.dataTransfer.files);\n  };\n\n  const removeFile = (index) => {\n    const newFiles = files.filter((_, i) => i !== index);\n    setFiles(newFiles);\n    onChange(multiple ? newFiles : null);\n  };\n\n  return (\n    <div style={{ fontFamily: \"'Marianne', Arial, sans-serif\" }}>\n      <div\n        onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}\n        onDragLeave={() => setIsDragging(false)}\n        onDrop={handleDrop}\n        onClick={() => !disabled && inputRef.current?.click()}\n        style={{\n          border: `2px dashed ${isDragging ? '#000091' : '#ddd'}`,\n          borderRadius: '8px',\n          padding: '32px',\n          textAlign: 'center',\n          background: isDragging ? '#f0f0ff' : '#f6f6f6',\n          cursor: disabled ? 'not-allowed' : 'pointer',\n          transition: 'all 0.2s',\n          opacity: disabled ? 0.6 : 1\n        }}\n      >\n        <div style={{ fontSize: '48px', marginBottom: '12px' }}>📁</div>\n        <div style={{ fontSize: '16px', fontWeight: '500', color: '#161616', marginBottom: '4px' }}>\n          {label}\n        </div>\n        <div style={{ fontSize: '12px', color: '#666' }}>\n          ou glissez-déposez vos fichiers ici\n        </div>\n        <div style={{ fontSize: '11px', color: '#999', marginTop: '8px' }}>\n          Taille max: {(maxSize / 1048576).toFixed(0)} MB\n        </div>\n      </div>\n\n      <input\n        ref={inputRef}\n        type=\"file\"\n        accept={accept}\n        multiple={multiple}\n        onChange={(e) => handleFiles(e.target.files)}\n        disabled={disabled}\n        style={{ display: 'none' }}\n      />\n\n      {files.length > 0 && (\n        <div style={{ marginTop: '16px' }}>\n          {files.map((file, index) => (\n            <div\n              key={index}\n              style={{\n                display: 'flex',\n                alignItems: 'center',\n                justifyContent: 'space-between',\n                padding: '8px 12px',\n                background: '#f6f6f6',\n                borderRadius: '4px',\n                marginBottom: '8px',\n                fontSize: '14px'\n              }}\n            >\n              <div style={{ display: 'flex', alignItems: 'center', gap: '8px', flex: 1, minWidth: 0 }}>\n                <span>📄</span>\n                <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>\n                  {file.name}\n                </span>\n                <span style={{ color: '#666', fontSize: '12px', flexShrink: 0 }}>\n                  ({(file.size / 1024).toFixed(1)} KB)\n                </span>\n              </div>\n              <button\n                onClick={(e) => { e.stopPropagation(); removeFile(index); }}\n                style={{\n                  background: 'transparent',\n                  border: 'none',\n                  color: '#e1000f',\n                  cursor: 'pointer',\n                  fontSize: '18px',\n                  padding: '4px 8px'\n                }}\n              >\n                ✕\n              </button>\n            </div>\n          ))}\n        </div>\n      )}\n    </div>\n  );\n};\n        ".trim()},{template_id:"base-tag",template_name:"DSFR Tag",category:"base",description:"DSFR Tag component with remove option",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  label = '',\n  onRemove = null,\n  color = '#000091',\n  size = 'md',\n  icon = null\n}) => {\n  const sizes = {\n    sm: { padding: '4px 8px', fontSize: '12px' },\n    md: { padding: '6px 12px', fontSize: '14px' },\n    lg: { padding: '8px 16px', fontSize: '16px' }\n  };\n\n  const sizing = sizes[size];\n\n  return (\n    <div style={{\n      display: 'inline-flex',\n      alignItems: 'center',\n      gap: '6px',\n      background: `${color}15`,\n      color: color,\n      padding: sizing.padding,\n      fontSize: sizing.fontSize,\n      borderRadius: '16px',\n      border: `1px solid ${color}40`,\n      fontFamily: \"'Marianne', Arial, sans-serif\",\n      fontWeight: '500'\n    }}>\n      {icon && <span>{icon}</span>}\n      <span>{label}</span>\n      {onRemove && (\n        <button\n          onClick={onRemove}\n          style={{\n            background: 'transparent',\n            border: 'none',\n            color: color,\n            cursor: 'pointer',\n            padding: '0',\n            fontSize: '14px',\n            lineHeight: 1,\n            display: 'flex',\n            alignItems: 'center'\n          }}\n        >\n          ✕\n        </button>\n      )}\n    </div>\n  );\n};\n        ".trim()},{template_id:"base-iconbutton",template_name:"DSFR Icon Button",category:"base",description:"DSFR Icon-only button component",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  icon = '⚙',\n  onClick = () => {},\n  variant = 'primary',\n  size = 'md',\n  disabled = false,\n  ariaLabel = 'Button'\n}) => {\n  const variantStyles = {\n    primary: { background: '#000091', color: 'white', hover: '#1212ff' },\n    secondary: { background: '#e3e3fd', color: '#000091', hover: '#c9c9fb' },\n    tertiary: { background: 'transparent', color: '#000091', hover: '#f5f5fe', border: '1px solid #000091' },\n    ghost: { background: 'transparent', color: '#666', hover: '#f6f6f6', border: 'none' }\n  };\n\n  const sizes = {\n    sm: { size: 32, fontSize: '16px' },\n    md: { size: 40, fontSize: '20px' },\n    lg: { size: 48, fontSize: '24px' }\n  };\n\n  const style = variantStyles[variant];\n  const sizing = sizes[size];\n\n  return (\n    <button\n      onClick={onClick}\n      disabled={disabled}\n      aria-label={ariaLabel}\n      style={{\n        width: sizing.size,\n        height: sizing.size,\n        background: style.background,\n        color: style.color,\n        border: style.border || 'none',\n        borderRadius: '4px',\n        cursor: disabled ? 'not-allowed' : 'pointer',\n        opacity: disabled ? 0.6 : 1,\n        transition: 'all 0.2s',\n        display: 'inline-flex',\n        alignItems: 'center',\n        justifyContent: 'center',\n        fontSize: sizing.fontSize,\n        flexShrink: 0\n      }}\n      onMouseEnter={(e) => {\n        if (!disabled) e.currentTarget.style.background = style.hover;\n      }}\n      onMouseLeave={(e) => {\n        if (!disabled) e.currentTarget.style.background = style.background;\n      }}\n    >\n      {icon}\n    </button>\n  );\n};\n        ".trim()},{template_id:"base-numberinput",template_name:"DSFR Number Input",category:"base",description:"DSFR Number input with increment/decrement buttons",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  value = 0,\n  onChange = () => {},\n  label = '',\n  min = null,\n  max = null,\n  step = 1,\n  disabled = false,\n  required = false,\n  unit = ''\n}) => {\n  const increment = () => {\n    const newValue = parseFloat(value) + step;\n    if (max === null || newValue <= max) onChange(newValue);\n  };\n\n  const decrement = () => {\n    const newValue = parseFloat(value) - step;\n    if (min === null || newValue >= min) onChange(newValue);\n  };\n\n  return (\n    <div style={{ marginBottom: '16px', fontFamily: \"'Marianne', Arial, sans-serif\" }}>\n      {label && (\n        <label style={{\n          display: 'block',\n          marginBottom: '8px',\n          fontWeight: '500',\n          color: '#161616',\n          fontSize: '14px'\n        }}>\n          {label}\n          {required && <span style={{ color: '#e1000f', marginLeft: '4px' }}>*</span>}\n        </label>\n      )}\n      <div style={{ display: 'flex', gap: '4px', alignItems: 'stretch' }}>\n        <button\n          onClick={decrement}\n          disabled={disabled || (min !== null && value <= min)}\n          style={{\n            width: '40px',\n            background: '#f6f6f6',\n            border: '1px solid #ddd',\n            borderRadius: '4px 0 0 4px',\n            cursor: disabled ? 'not-allowed' : 'pointer',\n            fontSize: '20px',\n            color: '#000091',\n            fontWeight: '700'\n          }}\n        >\n          −\n        </button>\n        <div style={{ position: 'relative', flex: 1 }}>\n          <input\n            type=\"number\"\n            value={value}\n            onChange={(e) => onChange(parseFloat(e.target.value) || 0)}\n            min={min}\n            max={max}\n            step={step}\n            disabled={disabled}\n            style={{\n              width: '100%',\n              padding: unit ? '12px 40px 12px 12px' : '12px',\n              fontSize: '16px',\n              fontFamily: \"'Marianne', Arial, sans-serif\",\n              border: '1px solid #ddd',\n              borderLeft: 'none',\n              borderRight: 'none',\n              boxSizing: 'border-box',\n              background: disabled ? '#f6f6f6' : 'white',\n              textAlign: 'center',\n              MozAppearance: 'textfield'\n            }}\n          />\n          {unit && (\n            <span style={{\n              position: 'absolute',\n              right: '12px',\n              top: '50%',\n              transform: 'translateY(-50%)',\n              fontSize: '14px',\n              color: '#666',\n              pointerEvents: 'none'\n            }}>\n              {unit}\n            </span>\n          )}\n        </div>\n        <button\n          onClick={increment}\n          disabled={disabled || (max !== null && value >= max)}\n          style={{\n            width: '40px',\n            background: '#f6f6f6',\n            border: '1px solid #ddd',\n            borderRadius: '0 4px 4px 0',\n            cursor: disabled ? 'not-allowed' : 'pointer',\n            fontSize: '20px',\n            color: '#000091',\n            fontWeight: '700'\n          }}\n        >\n          +\n        </button>\n      </div>\n    </div>\n  );\n};\n        ".trim()},{template_id:"base-rating",template_name:"DSFR Rating",category:"base",description:"DSFR Star rating component",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  value = 0,\n  onChange = null,\n  max = 5,\n  size = 'md',\n  readonly = false,\n  label = ''\n}) => {\n  const [hoverValue, setHoverValue] = useState(0);\n\n  const sizes = {\n    sm: 16,\n    md: 24,\n    lg: 32,\n    xl: 40\n  };\n\n  const starSize = sizes[size];\n  const isInteractive = onChange && !readonly;\n\n  return (\n    <div style={{ fontFamily: \"'Marianne', Arial, sans-serif\" }}>\n      {label && (\n        <div style={{\n          marginBottom: '8px',\n          fontWeight: '500',\n          color: '#161616',\n          fontSize: '14px'\n        }}>\n          {label}\n        </div>\n      )}\n      <div style={{\n        display: 'flex',\n        gap: '4px',\n        alignItems: 'center'\n      }}>\n        {Array.from({ length: max }, (_, index) => {\n          const starValue = index + 1;\n          const isFilled = starValue <= (hoverValue || value);\n\n          return (\n            <span\n              key={index}\n              onClick={() => isInteractive && onChange(starValue)}\n              onMouseEnter={() => isInteractive && setHoverValue(starValue)}\n              onMouseLeave={() => isInteractive && setHoverValue(0)}\n              style={{\n                fontSize: starSize,\n                color: isFilled ? '#ffc107' : '#ddd',\n                cursor: isInteractive ? 'pointer' : 'default',\n                transition: 'color 0.2s',\n                lineHeight: 1\n              }}\n            >\n              {isFilled ? '★' : '☆'}\n            </span>\n          );\n        })}\n        {value > 0 && (\n          <span style={{ marginLeft: '8px', fontSize: '14px', color: '#666' }}>\n            {value}/{max}\n          </span>\n        )}\n      </div>\n    </div>\n  );\n};\n        ".trim()},{template_id:"base-skeleton",template_name:"DSFR Skeleton",category:"base",description:"DSFR Skeleton loading placeholder",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  variant = 'text',\n  width = '100%',\n  height = null,\n  count = 1,\n  circle = false\n}) => {\n  const variantHeights = {\n    text: 16,\n    heading: 24,\n    button: 40,\n    card: 200,\n    avatar: 48\n  };\n\n  const finalHeight = height || variantHeights[variant];\n  const finalWidth = circle ? finalHeight : width;\n\n  return (\n    <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>\n      {Array.from({ length: count }, (_, index) => (\n        <div\n          key={index}\n          style={{\n            width: finalWidth,\n            height: finalHeight,\n            background: 'linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%)',\n            backgroundSize: '200% 100%',\n            animation: 'shimmer 1.5s infinite',\n            borderRadius: circle ? '50%' : '4px'\n          }}\n        />\n      ))}\n      <style>\n        {`\n          @keyframes shimmer {\n            0% { background-position: 200% 0; }\n            100% { background-position: -200% 0; }\n          }\n        `}\n      </style>\n    </div>\n  );\n};\n        ".trim()},{template_id:"base-stepper",template_name:"DSFR Stepper",category:"base",description:"DSFR Multi-step indicator",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  steps = [],\n  currentStep = 0,\n  onStepClick = null\n}) => {\n  return (\n    <div style={{\n      display: 'flex',\n      alignItems: 'center',\n      fontFamily: \"'Marianne', Arial, sans-serif\",\n      padding: '24px 0'\n    }}>\n      {steps.map((step, index) => {\n        const isActive = index === currentStep;\n        const isCompleted = index < currentStep;\n        const isClickable = onStepClick && index < currentStep;\n\n        return (\n          <React.Fragment key={index}>\n            <div\n              onClick={() => isClickable && onStepClick(index)}\n              style={{\n                display: 'flex',\n                flexDirection: 'column',\n                alignItems: 'center',\n                cursor: isClickable ? 'pointer' : 'default',\n                flex: index === steps.length - 1 ? '0' : '1'\n              }}\n            >\n              <div style={{\n                width: '40px',\n                height: '40px',\n                borderRadius: '50%',\n                background: isCompleted || isActive ? '#000091' : '#e5e5e5',\n                color: isCompleted || isActive ? 'white' : '#666',\n                display: 'flex',\n                alignItems: 'center',\n                justifyContent: 'center',\n                fontWeight: '700',\n                fontSize: '16px',\n                marginBottom: '8px',\n                border: isActive ? '3px solid #1212ff' : 'none',\n                boxSizing: 'border-box'\n              }}>\n                {isCompleted ? '✓' : index + 1}\n              </div>\n              <div style={{\n                fontSize: '12px',\n                fontWeight: isActive ? '700' : '400',\n                color: isActive ? '#000091' : '#666',\n                textAlign: 'center',\n                maxWidth: '100px',\n                lineHeight: 1.3\n              }}>\n                {step.label || step}\n              </div>\n            </div>\n\n            {index < steps.length - 1 && (\n              <div style={{\n                flex: '1',\n                height: '2px',\n                background: index < currentStep ? '#000091' : '#e5e5e5',\n                margin: '0 8px 24px 8px'\n              }} />\n            )}\n          </React.Fragment>\n        );\n      })}\n    </div>\n  );\n};\n        ".trim()},{template_id:"atomic-input-email",template_name:"Email Input",category:"base",description:"Specialized email input with validation",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  value = '',\n  onChange = () => {},\n  label = 'Email',\n  placeholder = 'exemple@domain.com',\n  required = false,\n  disabled = false,\n  autoValidate = true\n}) => {\n  const [error, setError] = useState('');\n\n  const validateEmail = (email) => {\n    if (!email && required) return 'Email requis';\n    if (email && !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email)) return 'Email invalide';\n    return '';\n  };\n\n  const handleChange = (newValue) => {\n    onChange(newValue);\n    if (autoValidate) {\n      setError(validateEmail(newValue));\n    }\n  };\n\n  const handleBlur = () => {\n    setError(validateEmail(value));\n  };\n\n  return (\n    <div style={{ marginBottom: '16px', fontFamily: \"'Marianne', Arial, sans-serif\" }}>\n      {label && (\n        <label style={{\n          display: 'block',\n          marginBottom: '8px',\n          fontWeight: '500',\n          color: '#161616',\n          fontSize: '14px'\n        }}>\n          {label}\n          {required && <span style={{ color: '#e1000f', marginLeft: '4px' }}>*</span>}\n        </label>\n      )}\n      <div style={{ position: 'relative' }}>\n        <span style={{\n          position: 'absolute',\n          left: '12px',\n          top: '50%',\n          transform: 'translateY(-50%)',\n          fontSize: '18px',\n          color: '#666'\n        }}>\n          ✉\n        </span>\n        <input\n          type=\"email\"\n          value={value}\n          onChange={(e) => handleChange(e.target.value)}\n          onBlur={handleBlur}\n          placeholder={placeholder}\n          disabled={disabled}\n          style={{\n            width: '100%',\n            padding: '12px 12px 12px 44px',\n            fontSize: '16px',\n            fontFamily: \"'Marianne', Arial, sans-serif\",\n            border: error ? '2px solid #e1000f' : '1px solid #ddd',\n            borderRadius: '4px',\n            boxSizing: 'border-box',\n            background: disabled ? '#f6f6f6' : 'white'\n          }}\n        />\n      </div>\n      {error && (\n        <div style={{ color: '#e1000f', fontSize: '12px', marginTop: '4px' }}>\n          {error}\n        </div>\n      )}\n    </div>\n  );\n};\n        ".trim()},{template_id:"atomic-input-phone",template_name:"Phone Input",category:"base",description:"Specialized phone input with formatting",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  value = '',\n  onChange = () => {},\n  label = 'Téléphone',\n  placeholder = '06 12 34 56 78',\n  required = false,\n  disabled = false,\n  country = 'FR'\n}) => {\n  const [error, setError] = useState('');\n\n  const formatPhone = (phone) => {\n    const digits = phone.replace(/\\D/g, '');\n    if (country === 'FR') {\n      return digits.replace(/(\\d{2})(?=\\d)/g, '$1 ').trim();\n    }\n    return digits;\n  };\n\n  const validatePhone = (phone) => {\n    if (!phone && required) return 'Téléphone requis';\n    const digits = phone.replace(/\\D/g, '');\n    if (phone && country === 'FR' && digits.length !== 10) return 'Téléphone invalide (10 chiffres)';\n    return '';\n  };\n\n  const handleChange = (newValue) => {\n    const formatted = formatPhone(newValue);\n    onChange(formatted);\n    setError(validatePhone(formatted));\n  };\n\n  return (\n    <div style={{ marginBottom: '16px', fontFamily: \"'Marianne', Arial, sans-serif\" }}>\n      {label && (\n        <label style={{\n          display: 'block',\n          marginBottom: '8px',\n          fontWeight: '500',\n          color: '#161616',\n          fontSize: '14px'\n        }}>\n          {label}\n          {required && <span style={{ color: '#e1000f le={{\n            width: '100%',\n            padding: '12px 12px 12px 44px',\n            fontSize: '16px',\n            fontFamily: \"'Marianne', Arial, sans-serif\",\n            border: error ? '2px solid #e1000f' : '1px solid #ddd',\n            borderRadius: '4px',\n            boxSizing: 'border-box',\n            background: disabled ? '#f6f6f6' : 'white'\n          }}\n        />\n        {value && !error && (\n          <a\n            href={value}\n            target=\"_blank\"\n            rel=\"noopener noreferrer\"\n            style={{\n              position: 'absolute',\n              right: '12px',\n              top: '50%',\n              transform: 'translateY(-50%)',\n              fontSize: '16px',\n              color: '#000091',\n              textDecoration: 'none'\n            }}\n          >\n            ↗\n          </a>\n        )}\n      </div>\n      {error && (\n        <div style={{ color: '#e1000f', fontSize: '12px', marginTop: '4px' }}>\n          {error}\n        </div>\n      )}\n    </div>\n  );\n};\n        ".trim()},{template_id:"atomic-input-percentage",template_name:"Percentage Input",category:"base",description:"Specialized percentage input",is_active:!0,created_at:e,updated_at:e,component_code:"\nconst Component = ({\n  value = 0,\n  onChange = () => {},\n  label = 'Pourcentage',\n  min = 0,\n  max = 100,\n  step = 1,\n  required = false,\n  disabled = false,\n  showSlider = false\n}) => {\n  const handleChange = (newValue) => {\n    const numValue = Math.min(max, Math.max(min, parseFloat(newValue) || 0));\n    onChange(numValue);\n  };\n\n  return (\n    <div style={{ marginBottom: '16px', fontFamily: \"'Marianne', Arial, sans-serif\" }}>\n      {label && (\n        <label style={{\n          display: 'block',\n          marginBottom: '8px',\n          fontWeight: '500',\n          color: '#161616',\n          fontSize: '14px'\n        }}>\n          {label}\n          {required && <span style={{ color: '#e1000f', margin
